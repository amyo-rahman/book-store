<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
    <div class="flex items-center gap-3">
      <span
        class="flex size-9 items-center justify-center rounded-lg bg-indigo-600 text-white"
        aria-hidden="true"
      >
        <i class="pi pi-book"></i>
      </span>
      <div class="leading-tight">
        <h1 class="text-base font-bold">Book Store</h1>
        <p class="text-xs text-slate-500">Inventory manager</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <label for="genre-filter" class="text-sm text-slate-600">Genre</label>
      <p-select
        inputId="genre-filter"
        [options]="options()"
        optionLabel="genre"
        optionValue="genre"
        [placeholder]="placeholder()"
        [showClear]="true"
        class="w-52"
      >
        <ng-template #item let-option>
          <div class="flex w-full items-center justify-between gap-3">
            <span>{{ option.genre }}</span>
            <span class="rounded-full bg-slate-100 px-2 text-xs text-slate-600">{{ option.count }}</span>
          </div>
        </ng-template>
      </p-select>
      <span class="hidden h-6 w-px bg-slate-200 sm:block" aria-hidden="true"></span>
      <p-button label="Add book" icon="pi pi-plus" />
    </div>
  </div>
</header>
